<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Страница абитуриента</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .applicant-layout {
      display: flex;
      gap: 24px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .left-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      flex-shrink: 0;
    }
    .right-panel { flex: 1; }
    .action-buttons { display: flex; flex-direction: column; gap: 10px; width: 180px; }
    .action-buttons .btn { width: 100%; justify-content: center; }
    .delete-btn {margin-top: 16 px;};
  </style>
</head>
<body>
<div class="app-wrapper">
  <div class="topbar">
    <a class="topbar-back" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      Назад к общей таблице
    </a>
    <span class="topbar-title" id="page-title">Страница абитуриента</span>
  </div>
  <div class="page-content">
    <div id="loading" class="loading"><div class="spinner"></div>Загрузка...</div>
    <div id="content" style="display:none">
      <div class="applicant-layout">
        <div class="left-panel">
          <div class="photo-placeholder" id="photo-container">
            <div class="placeholder-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
              <span>Фото</span>
            </div>
          </div>
          <input type="file" id="photo-input" accept="image/*" style="display: none;" onchange="uploadPhoto(this)">

          <div class="divider" style="width:100%"></div>

          <div class="action-buttons">
            <button class="btn btn-primary" id="edit-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              Редактировать данные
            </button>
            <button class="btn btn-secondary" id="docs-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8zM14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
              Загрузить сканы
            </button>
            <button class="btn btn-danger delete-btn" id="delete-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 13a2 2 0 002 2h8a2 2 0 002-2l1-13M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3"/></svg>
              Удалить абитуриента
            </button>
          </div>
        </div>

        <div class="right-panel">
          <div class="fields-section">
            <div class="section-header">Основные данные</div>
            <div class="form-grid">
              <div class="field-row"><label class="form-label">Имя на русском</label><div class="field-value" id="ru-first-name">—</div></div>
              <div class="field-row"><label class="form-label">Имя на китайском</label><div class="field-value" id="cn-first-name">—</div></div>
              <div class="field-row"><label class="form-label">Фамилия на русском</label><div class="field-value" id="ru-last-name">—</div></div>
              <div class="field-row"><label class="form-label">Фамилия на китайском</label><div class="field-value" id="cn-last-name">—</div></div>
              <div class="field-row"><label class="form-label">Email</label><div class="field-value" id="email">—</div></div>
              <div class="field-row"><label class="form-label">Пароль</label><div class="field-value" id="password">—</div></div>
              <div class="field-row">
                <label class="form-label">Пол</label>
                <div class="radio-group" id="gender-group">
                  <label><input type="radio" name="gender" value="male" disabled>Мужской</label>
                  <label><input type="radio" name="gender" value="female" disabled>Женский</label>
                </div>
              </div>
              <div class="field-row">
                <label class="form-label">Образование</label>
                <div class="radio-group" id="education-group">
                  <label><input type="radio" name="education" value="bachelor" disabled>Бакалавр</label>
                  <label><input type="radio" name="education" value="master" disabled>Магистр</label>
                </div>
              </div>
          </div>

          <div class="divider"></div>

          <div class="fields-section">
            <div class="section-header">Дополнительные данные</div>
            <div class="form-grid">
              <div class="field-row"><label class="form-label">Код специализации</label><div class="field-value" id="spec-code">—</div></div>
              <div class="field-row"><label class="form-label">Название специализации</label><div class="field-value" id="spec-name">—</div></div>
              <div class="field-row"><label class="form-label">Партнёр</label><div class="field-value" id="partner">—</div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="toast-container" class="toast-container"></div>
<script src="/static/js/utils.js"></script>
<script>
const APPLICANT_ID = {{applicant_id}};
let applicantData = null;

function setField(id, val) {
  const el = document.getElementById(id);
  if (!el) return;
  if (val) {
    el.textContent = val;
    el.classList.remove('empty');
  } else {
    el.textContent = '—';
    el.classList.add('empty');
  }
}

function setRadioValue(groupId, value) {
  const radios = document.querySelectorAll(`#${groupId} input[type="radio"]`);
  radios.forEach(radio => {
    radio.checked = (radio.value === value);
  });
}

async function loadApplicant() {
  try {
    applicantData = await apiGet(`/api/applicants/${APPLICANT_ID}`);
    const a = applicantData;

    document.getElementById('page-title').textContent =
      `${a.last_name_ru || ''} ${a.first_name_ru || ''}`.trim() || 'Абитуриент';

    setField('ru-first-name', a.first_name_ru);
    setField('cn-first-name', a.first_name_cn);
    setField('ru-last-name', a.last_name_ru);
    setField('cn-last-name', a.last_name_cn);
    setField('email', a.email);
    setField('password', a.password);

    if (a.gender) setRadioValue('gender-group', a.gender);
    if (a.education) {
      setRadioValue('education-group', a.education);
    }

    setField('spec-code', a.specialization_code);
    setField('spec-name', a.specialization_name);
    setField('partner', a.partner);

    if (a.photo_path) {
      const container = document.getElementById('photo-container');
      container.innerHTML = `<img src="/uploads/${a.photo_path}" alt="Фото">`;
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  } catch (e) {
    showToast('Ошибка загрузки', 'error');
  }
}

async function uploadPhoto(input) {
  if (!input.files[0]) return;
  const fd = new FormData();
  fd.append('applicant_id', APPLICANT_ID);
  fd.append('file', input.files[0]);
  try {
    const res = await uploadFile('/api/upload/photo', fd);
    const container = document.getElementById('photo-container');
    container.innerHTML = `<img src="${res.url}" alt="Фото">`;
    showToast('Фото загружено', 'success');
  } catch (e) {
    showToast('Ошибка загрузки фото', 'error');
  }
}

document.getElementById('photo-container').addEventListener('click', () => {
  document.getElementById('photo-input').click();
})

document.getElementById('edit-btn').onclick = () => navigate(`/edit/${APPLICANT_ID}`);
document.getElementById('docs-btn').onclick = () => navigate(`/documents/${APPLICANT_ID}`);
document.getElementById('delete-btn').onclick = async () => {
  if (!confirm('Вы уверены, что хотите удалить этого абитуриента?\n\nЭто действие нельзя отменить.')) {
    return;
  }
  
  const deleteBtn = document.getElementById('delete-btn');
  const originalText = deleteBtn.innerHTML;
  deleteBtn.disabled = true;
  deleteBtn.innerHTML = '<span>Удаление...</span>';
  
  try {
    await apiDelete(`/api/applicants/${APPLICANT_ID}`);
    showToast('Абитуриент удалён', 'success');
    setTimeout(() => navigate('/'), 800);
  } catch (e) {
    showToast('Ошибка удаления', 'error');
    deleteBtn.disabled = false;
    deleteBtn.innerHTML = originalText;
  }
};

loadApplicant();
</script>
</body>
</html>
