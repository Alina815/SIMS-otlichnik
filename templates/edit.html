<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Редактирование персональных данных</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .edit-layout { max-width: 960px; margin: 0 auto; }
    .save-bar {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .spec-note {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      font-style: italic;
    }
  </style>
</head>
<body>
<div class="app-wrapper">
  <div class="topbar">
    <a class="topbar-back" id="back-btn" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      Назад к странице абитуриента
    </a>
    <span class="topbar-title">Редактирование персональных данных</span>
  </div>
  <div class="page-content">
    <div id="loading" class="loading"><div class="spinner"></div>Загрузка...</div>
    <div id="content" style="display:none" class="edit-layout">
      <div class="card">
        <div class="fields-section">
          <div class="section-header">Основные данные</div>
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label">Имя на русском</label>
              <input class="form-control" id="first_name_ru" type="text" placeholder="Имя">
            </div>
            <div class="form-group">
              <label class="form-label">Имя на китайском</label>
              <input class="form-control" id="first_name_cn" type="text" placeholder="名">
            </div>
            <div class="form-group">
              <label class="form-label">Фамилия на русском</label>
              <input class="form-control" id="last_name_ru" type="text" placeholder="Фамилия">
            </div>
            <div class="form-group">
              <label class="form-label">Фамилия на китайском</label>
              <input class="form-control" id="last_name_cn" type="text" placeholder="姓">
            </div>
            <div class="form-group">
              <label class="form-label">Email</label>
              <input class="form-control" id="email" type="email" placeholder="example@mail.ru">
            </div>
            <div class="form-group">
              <label class="form-label">Пароль</label>
              <input class="form-control" id="password" type="text" placeholder="Пароль">
            </div>
            <div class="form-group">
              <label class="form-label">Пол</label>
              <div class="radio-group" id="gender-group">
                <label><input type="radio" name="gender" value="male"> Мужчина</label>
                <label><input type="radio" name="gender" value="female"> Женщина</label>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Образование</label>
              <div class="radio-group" id="education-group">
                <label><input type="radio" name="education" value="bachelor"> Бакалавр</label>
                <label><input type="radio" name="education" value="master"> Магистр</label>
              </div>
            </div>
          </div>
        </div>

        <div class="divider"></div>

        <div class="fields-section">
          <div class="section-header">Дополнительные данные</div>
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label">Код специализации</label>
              <input class="form-control" id="spec_code" type="text" placeholder="Код">
            </div>
            <div class="form-group">
              <label class="form-label">Название специализации</label>
              <input class="form-control" id="spec_name" type="text" placeholder="Название">
            </div>
            <div class="form-group">
              <label class="form-label">Партнёр</label>
              <input class="form-control" id="partner" type="text" placeholder="Организация-партнёр">
            </div>
          </div>
          </div>
        </div>

        <div class="save-bar">
          <button class="btn btn-secondary" id="cancel-btn">Отмена</button>
          <button class="btn btn-primary" onclick="saveData()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2zM17 21v-8H7v8M7 3v5h8"/></svg>
            Сохранить изменения
          </button>
        </div>         
      </div>
    </div>
  </div>
</div>
<div id="toast-container" class="toast-container"></div>
<script src="/static/js/utils.js"></script>
<script>
const APPLICANT_ID = {{applicant_id}};

document.getElementById('back-btn').href = `/applicant/${APPLICANT_ID}`;
document.getElementById('cancel-btn').onclick = () => navigate(`/applicant/${APPLICANT_ID}`);

async function loadData() {
  try {
    const a = await apiGet(`/api/applicants/${APPLICANT_ID}`);

    document.getElementById('first_name_ru').value = a.first_name_ru || '';
    document.getElementById('last_name_ru').value = a.last_name_ru || '';
    document.getElementById('first_name_cn').value = a.first_name_cn || '';
    document.getElementById('last_name_cn').value = a.last_name_cn || '';
    document.getElementById('email').value = a.email || '';
    document.getElementById('password').value = a.password || '';
    document.getElementById('spec_code').value = a.specialization_code || '';
    document.getElementById('spec_name').value = a.specialization_name || '';
    document.getElementById('partner').value = a.partner || '';

    if (a.gender) {
      const radio = document.querySelector(`#gender-group input[value="${a.gender}"]`);
      if (radio) radio.checked = true;
    }
    if (a.education) {
      const radio = document.querySelector(`#education-group input[value="${a.education}"]`);
      if (radio) radio.checked = true;
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  } catch (e) {
    showToast('Ошибка загрузки', 'error');
  }
}

async function saveData() {
  const data = {
    first_name_ru: document.getElementById('first_name_ru').value,
    last_name_ru: document.getElementById('last_name_ru').value,
    first_name_cn: document.getElementById('first_name_cn').value,
    last_name_cn: document.getElementById('last_name_cn').value,
    gender: document.querySelector('#gender-group input:checked').value,
    email: document.getElementById('email').value,
    password: document.getElementById('password').value,
    education: document.querySelector('#education-group input:checked').value,
    specialization_code: document.getElementById('spec_code').value,
    specialization_name: document.getElementById('spec_name').value,
    partner: document.getElementById('partner').value,
  };

  try {
    await apiPut(`/api/applicants/${APPLICANT_ID}`, data);
    showToast('Данные сохранены', 'success');
    setTimeout(() => navigate(`/applicant/${APPLICANT_ID}`), 800);
  } catch (e) {
    showToast('Ошибка сохранения', 'error');
  }
}

loadData();
</script>
</body>
</html>
