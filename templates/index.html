<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Общая таблица</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .page-header h1 { font-size: 18px; font-weight: 700; }
    .table-wrapper { height: calc(100vh - 120px); }
    .action-cell { display: flex; gap: 6px; }
    td.action-cell { max-width: none; }
  </style>
</head>
<body>
<div class="app-wrapper">
  <div class="page-content">
    <div class="table-controls">
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">Все абитуриенты</button>
        <button class="filter-tab" data-filter="bachelor">Бакалавры</button>
        <button class="filter-tab" data-filter="master">Магистры</button>
      </div>
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="10" cy="10" r="7"/>
          <line x1="15" y1="15" x2="21" y2="21"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Поиск по фамилии, имени, email" class="search-input">
      </div>
    </div>
    <div class="page-header">
      <h1>Общая таблица</h1>
      <div class="btn-toolbar">
        <button class="btn btn-primary" onclick="addApplicant()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          Добавить абитуриента
        </button>
        <button class="btn btn-secondary" onclick="exportExcel()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          Экспорт в Excel
        </button>
      </div>
    </div>
      <div class="table-wrapper" id="table-wrapper">
        <div class="loading"><div class="spinner"></div>Загрузка...</div>
      </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>

<script src="/static/js/utils.js"></script>
<script>
let currentFilter = 'all';
let searchQuery = '';

let applicants = [];
let sortCol = null, sortDir = 1;

const columns = [
  { key: 'last_name_ru',           label: 'Фамилия (рус)' },
  { key: 'first_name_ru',          label: 'Имя (рус)' },
  { key: 'last_name_cn',           label: 'Фамилия (кит)' },
  { key: 'first_name_cn',          label: 'Имя (кит)' },
  { key: 'gender',                 label: 'Пол' },
  { key: 'education',         label: 'Образование' },
  { key: 'specialization_code',    label: 'Код специализации' },
  { key: 'specialization_name',    label: 'Название специализации' },
  { key: 'email',                  label: 'Email' },
  { key: 'password',               label: 'Пароль' },
  { key: 'snils',                  label: 'СНИЛС' },
  { key: 'passport_number',        label: 'Номер паспорта' },
  { key: 'passport_expiry',        label: 'Срок паспорта' },
  { key: 'passport_issued_by',     label: 'Кем выдан' },
  { key: 'doc1_number',            label: 'Документ 1' },
  { key: 'doc2_number',            label: 'Документ 2' },
  { key: 'partner',                label: 'Партнёр' },
];

async function loadApplicants() {
  try {
    applicants = await apiGet('/api/applicants');
    renderTable();
  } catch (e) {
    showToast('Ошибка загрузки данных', 'error');
    document.getElementById('table-wrapper').innerHTML = '<div class="loading">Ошибка загрузки</div>';
  }
}

function getDocumentLabels() {
  if (currentFilter === 'bachelor') {
    return { doc1: 'Аттестат', doc2: 'Свидетельство об оценках' };
  } else if (currentFilter === 'master') {
    return { doc1: 'Диплом', doc2: 'Диплом бакалавра' };
  } else {
    return { doc1: 'Аттестат / Диплом', doc2: 'Свидетельство / Диплом бакалавра' };
  }
}

function updateColumnLabels() {
  const labels = getDocumentLabels();
  const headers = document.querySelectorAll("thead th");
  if (headers.length) {
    const doc1Index = columns.findIndex(c => c.key === 'doc1_number');
    const doc2Index = columns.findIndex(c => c.key === 'doc2_number');
    if (headers[doc1Index]) headers[doc1Index].textContent = labels.doc1;
    if (headers[doc2Index]) headers[doc2Index].textContent = labels.doc2;
  }
}

function filterApplicants(applicants) {
  let filtered = [...applicants];
  if (currentFilter == 'bachelor') {
    filtered = filtered.filter(a => a.education == 'Бакалавр');
  } else if (currentFilter == 'master') {
    filtered = filtered.filter(a => a.education == 'Магистр');
  }
  if (searchQuery.trim()) {
    const query = searchQuery.toLowerCase().trim();
    filtered = filtered.filter(a => (
      (a.last_name_ru && a.last_name_ru.toLowerCase().includes(query)) ||
      (a.last_name_cn && a.last_name_cn.toLowerCase().includes(query)) ||
      (a.first_name_ru && a.first_name_ru.toLowerCase().includes(query)) ||
      (a.first_name_cn && a.first_name_cn.toLowerCase().includes(query)) ||
      (a.email && a.email.toLowerCase().includes(query))
    ));
  }
  return filtered;
}

function renderTable() {
  const wrapper = document.getElementById('table-wrapper');
  let filtered = filterApplicants(applicants);
  let rows = [...filtered];
  if (sortCol) {
    rows.sort((a, b) => {
      const av = (a[sortCol] || '').toString();
      const bv = (b[sortCol] || '').toString();
      return av.localeCompare(bv, 'ru') * sortDir;
    });
  }

  const labels = getDocumentLabels();

  const dynamicColumns = columns.map(c => {
    if (c.key == 'doc1_number') {
      return { ...c, label: labels.doc1};
    } else if (c.key === 'doc2_number') {
      return { ...c, label: labels.doc2 };
    }
    return c;
  });

  const thead = `<thead><tr>
    ${dynamicColumns.map(c => `<th class="sortable" onclick="setSort('${c.key}')" data-col="${c.key}">
      ${c.label}${sortCol === c.key ? (sortDir === 1 ? ' ↑' : ' ↓') : ''}
    </th>`).join('')}
    <th>Действия</th>
  </tr></thead>`;

  const tbody = rows.length === 0
    ? `<tbody><tr class="empty-row"><td colspan="${columns.length + 1}">Данные не найдены.</td></tr></tbody>`
    : `<tbody>${rows.map(a => `
      <tr onclick="navigate('/applicant/${a.id}')">
        ${columns.map(c => `<td title="${a[c.key] || ''}">${a[c.key] || '—'}</td>`).join('')}
        <td class="action-cell" onclick="event.stopPropagation()">
          <button class="btn btn-sm btn-secondary" onclick="navigate('/applicant/${a.id}')">Открыть</button>
          <button class="btn btn-sm btn-danger" onclick="deleteApplicant(${a.id})">Удалить</button>
        </td>
      </tr>`).join('')}
    </tbody>`;

  wrapper.innerHTML = `<table>${thead}${tbody}</table>`;
}

function initFilters() {
  const tabs = document.querySelectorAll('.filter-tab');
  if (tabs.length) {
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(tab => tab.classList.remove('active'));
        tab.classList.add('active');
        currentFilter = tab.dataset.filter;
        renderTable();
      });
    });
  }
  const searchInput = document.getElementById('searchInput');
  if (searchInput) {
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderTable();
    });
  }
}

function setSort(col) {
  if (sortCol === col) sortDir *= -1;
  else { sortCol = col; sortDir = 1; }
  renderTable();
}

async function addApplicant() {
  try {
    const res = await apiPost('/api/applicants', {});
    showToast('Абитуриент создан', 'success');
    navigate(`/applicant/${res.id}`);
  } catch (e) {
    showToast('Ошибка создания', 'error');
  }
}

async function deleteApplicant(id) {
  if (!confirm('Удалить этого абитуриента?')) return;
  try {
    await apiDelete(`/api/applicants/${id}`);
    showToast('Удалено', 'success');
    loadApplicants();
  } catch (e) {
    showToast('Ошибка удаления', 'error');
  }
}

function exportExcel() {
  window.location.href = '/api/export/applicants';
  showToast('Скачивание Excel...', 'info');
}

loadApplicants();
initFilters();
</script>
</body>
</html>
