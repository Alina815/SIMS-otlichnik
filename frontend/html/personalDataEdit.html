<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Личная страница</title>
    <link rel="stylesheet" href="../css/personalDataEdit.css">
</head>
<body>

    <!-- Слева: твоя анкета -->
    <aside class="sidebar">
        <div class="avatar-block">
            <img src="../../design/1.jpeg" alt="Аватар">
            <p><strong>Имя, Фамилия</strong></p>
            <button type="button" id="btnPhoto">+ ЗАГРУЗИТЬ ФОТО</button>
        </div>
        <div id="Russia">
        <h3>НА РУССКОМ ЯЗЫКЕ:</h3>
        <input type="text" placeholder="Имя">
        <input type="text" placeholder="Фамилия">
        <input type="email" placeholder="Эл. почта">
        <input type="password" placeholder="Пароль">
        <input type="text" placeholder="Код специализации">
        <input type="text" placeholder="Название специализации">
        </div>

        <div id="China">
        <h3>НА КИТАЙСКОМ ЯЗЫКЕ:</h3>
        <input type="text" placeholder="Имя">
        <input type="text" placeholder="Фамилия">
        <input type="email" placeholder="Эл. почта">
        <input type="password" placeholder="Пароль">
        <input type="text" placeholder="Код специализации">
        <input type="text" placeholder="Название специализации">
        </div>
    </aside>

    <!-- Справа: ряды документов -->
    <main class="content">
        
        <!-- РЯД 1: РУССКИЙ ЯЗЫК -->
        <h2>ДОКУМЕНТЫ (RU)</h2>
        <div class="doc-row">
            <!-- Паспорт -->
            <div class="doc-card">
                <h4>ПАСПОРТ</h4>
                <img src="../../design/1.jpeg" alt="doc">
                <button type="button" id="btnRUPassport">+ РЕДАКТИРОВАТЬ ФОТО</button>
                <div class="fields">
                    <input type="text" placeholder="НОМЕР">
                    <input type="text" placeholder="КОГДА ВЫДАН">
                    <input type="text" placeholder="КЕМ ВЫДАН">
                    <input type="text" placeholder="МЕСТО ВЫДАЧИ">
                    <input type="text" placeholder="ПРОВИНЦИЯ РОЖДЕНИЯ">
                </div>
            </div>
            <!-- СНИЛС -->
            <div class="doc-card">
                <h4>СНИЛС</h4>
                <img src="../../design/1.jpeg" alt="doc">
                <button type="button" id="btnRUSNILS">+ РЕДАКТИРОВАТЬ ФОТО</button>
                <div class="fields"><input type="text" placeholder="НОМЕР"></div>
            </div>
            <!-- Аттестат -->
            <div class="doc-card">
                <h4>АТТЕСТАТ/ДИПЛОМ</h4>
                <img src="../../design/1.jpeg" alt="doc">
                <button type="button" id="btnRuDoc1">+ РЕДАКТИРОВАТЬ ФОТО</button>
                <div class="fields">
                    <input type="text" placeholder="НОМЕР">
                    <input type="text" placeholder="КОГДА ВЫДАН">
                    <input type="text" placeholder="НАЗВАНИЕ УЧ. ЗАВЕДЕНИЯ">
                </div>
            </div>
            <!-- Оценки -->
            <div class="doc-card">
                <h4>ОЦЕНКИ</h4>
                <img src="../../design/1.jpeg" alt="doc">
                <button type="button" id="btnRUDoc2">+ РЕДАКТИРОВАТЬ ФОТО</button>
                <div class="fields"><input type="text" placeholder="НОМЕР"></div>
            </div>
            <!-- Успеваемость -->
            <div class="doc-card">
                <h4>УСПЕВАЕМОСТЬ</h4>
                <img src="../../design/1.jpeg" alt="doc">
                <button type="button" id="btnRUPerformance">+ РЕДАКТИРОВАТЬ ФОТО</button>
                <div class="fields"><input type="text" placeholder="НОМЕР"></div>
            </div>
        </div>

        <!-- РЯД 2: КИТАЙСКИЙ ЯЗЫК -->
        <h2>ДОКУМЕНТЫ (CN)</h2>
        <div class="doc-row">
            <div class="doc-card">
                <h4>ПАСПОРТ (CN)</h4>
                <img src="../../design/1.jpeg" alt="doc">
                <button type="button" id="btnCNPassport">+ РЕДАКТИРОВАТЬ ФОТО</button>
                <div class="fields">
                    <input type="text" placeholder="НОМЕР">
                    <input type="text" placeholder="КОГДА ВЫДАН">
                    <input type="text" placeholder="КЕМ ВЫДАН">
                    <input type="text" placeholder="МЕСТО ВЫДАЧИ">
                    <input type="text" placeholder="ПРОВИНЦИЯ РОЖДЕНИЯ">
                </div>
            </div>
            <div class="doc-card">
                <h4>СНИЛС (CN)</h4>
                <img src="../../design/1.jpeg" alt="doc">
                <button type="button" id="btnCNSNILS">+ РЕДАКТИРОВАТЬ ФОТО</button>
                <div class="fields"><input type="text" placeholder="НОМЕР"></div>
            </div>
            <div class="doc-card">
                <h4>ДИПЛОМ (CN)</h4>
                <img src="../../design/1.jpeg" alt="doc">
                <button type="button" id="btnCNDoc1">+ РЕДАКТИРОВАТЬ ФОТО</button>
                <div class="fields">
                    <input type="text" placeholder="НОМЕР">
                    <input type="text" placeholder="КОГДА ВЫДАН">
                    <input type="text" placeholder="НАЗВАНИЕ УЧ. ЗАВЕДЕНИЯ">
                </div>
            </div>
            <div class="doc-card">
                <h4>ОЦЕНКИ (CN)</h4>
                <img src="../../design/1.jpeg" alt="doc">
                <button type="button" id="btnCNDoc2">+ РЕДАКТИРОВАТЬ ФОТО</button>
                <div class="fields"><input type="text" placeholder="НОМЕР"></div>
            </div>
            <div class="doc-card">
                <h4>УСПЕВАЕМОСТЬ (CN)</h4>
                <img src="../../design/1.jpeg" alt="doc">
                <button type="button" id="btnCNPerformance">+ РЕДАКТИРОВАТЬ ФОТО</button>
                <div class="fields"><input type="text" placeholder="НОМЕР"></div>
            </div>
        </div>

    </main>
    <script src="../js/form.js"></script>
</body>
</html>
